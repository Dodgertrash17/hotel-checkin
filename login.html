<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="DerGhanLogo.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Check-In — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-box">
    <h1>🏨 Hotel Check-In</h1>
    <p>Staff access only</p>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="staff@hotel.com" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" />
    </div>

    <div class="error-msg" id="error-msg">Incorrect email or password.</div>

    <button class="btn btn-primary" id="login-btn" style="width:100%; padding:.7rem;">
      Log In
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="login.js"></script>
</body>
</html>
